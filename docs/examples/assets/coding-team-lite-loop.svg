<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" role="img" aria-labelledby="title desc">
  <title id="title">The coding-team lite delivery loop</title>
  <desc id="desc">A plain-English goal becomes scoped work, implementation, independent evidence, and a human ship decision.</desc>
  <style>
    .bg { fill: #f7f4ed; }
    .card { fill: #fffdf8; stroke: #17324d; stroke-width: 3; }
    .accent { fill: #f0b44d; }
    .ink { fill: #17324d; font-family: Arial, sans-serif; }
    .label { font-size: 25px; font-weight: 700; }
    .note { font-size: 18px; }
    .arrow { fill: none; stroke: #d56b42; stroke-width: 5; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#d56b42" />
    </marker>
  </defs>
  <rect class="bg" width="1300" height="430" rx="24" />
  <text class="ink label" x="50" y="55">A small path from idea to a human ship decision</text>
  <g transform="translate(46 105)">
    <rect class="card" width="205" height="160" rx="18" />
    <rect class="accent" width="205" height="12" rx="6" />
    <text class="ink label" x="22" y="58">Say it</text>
    <text class="ink note" x="22" y="94">Plain-English</text>
    <text class="ink note" x="22" y="120">goal</text>
  </g>
  <path class="arrow" d="M251 185 H297" />
  <g transform="translate(297 105)">
    <rect class="card" width="205" height="160" rx="18" />
    <rect class="accent" width="205" height="12" rx="6" />
    <text class="ink label" x="22" y="58">Scope it</text>
    <text class="ink note" x="22" y="94">Lead + role</text>
    <text class="ink note" x="22" y="120">card</text>
  </g>
  <path class="arrow" d="M502 185 H548" />
  <g transform="translate(548 105)">
    <rect class="card" width="205" height="160" rx="18" />
    <rect class="accent" width="205" height="12" rx="6" />
    <text class="ink label" x="22" y="58">Build it</text>
    <text class="ink note" x="22" y="94">Bounded files</text>
    <text class="ink note" x="22" y="120">and stop rule</text>
  </g>
  <path class="arrow" d="M753 185 H799" />
  <g transform="translate(799 105)">
    <rect class="card" width="205" height="160" rx="18" />
    <rect class="accent" width="205" height="12" rx="6" />
    <text class="ink label" x="22" y="58">Prove it</text>
    <text class="ink note" x="22" y="94">Test evidence</text>
    <text class="ink note" x="22" y="120">before review</text>
  </g>
  <path class="arrow" d="M1004 185 H1050" />
  <g transform="translate(1050 105)">
    <rect class="card" width="205" height="160" rx="18" />
    <rect class="accent" width="205" height="12" rx="6" />
    <text class="ink label" x="22" y="58">Ship it</text>
    <text class="ink note" x="22" y="94">Human calls</text>
    <text class="ink note" x="22" y="120">the decision</text>
  </g>
  <text class="ink note" x="50" y="345">If evidence is missing: stop, report BLOCKED, and ask for the next decision.</text>
</svg>
