<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Coding Team multiagent orchestration</title>
  <desc id="desc">One Lead decomposes a goal into Sprint, Batches, and bounded Tasks, dispatches at most two specialist agents at once, and gates every batch through Code Reviewer, Test Engineer, and a human Gatekeeper decision. Model tiers are abstract hints, never provider locks.</desc>
  <style>
    .bg { fill: #f7f4ed; }
    .card { fill: #fffdf8; stroke: #17324d; stroke-width: 3; }
    .lead { fill: #1e4b7d; }
    .agent { fill: #fff; stroke: #2a6d9f; stroke-width: 4; }
    .gate { fill: #fff9e6; stroke: #b8860b; stroke-width: 3; }
    .human { fill: #ffe8e8; stroke: #c0392b; stroke-width: 3; }
    .label { fill: #17324d; font-family: Arial, sans-serif; font-weight: 700; }
    .note { fill: #333; font-family: Arial, sans-serif; }
    .small { font-size: 15px; }
    .xsmall { font-size: 13px; }
    .arrow { fill: none; stroke: #2a6d9f; stroke-width: 4; marker-end: url(#arrowhead); }
    .gatearrow { fill: none; stroke: #b8860b; stroke-width: 4; marker-end: url(#gatehead); }
    .humanarrow { fill: none; stroke: #c0392b; stroke-width: 4; stroke-dasharray: 12,8; marker-end: url(#humanhead); }
    .constraint { fill: none; stroke: #17324d; stroke-width: 2; stroke-dasharray: 6,5; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#2a6d9f" />
    </marker>
    <marker id="gatehead" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#b8860b" />
    </marker>
    <marker id="humanhead" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#c0392b" />
    </marker>
  </defs>
  <rect class="bg" width="1400" height="760" rx="24" />
  <text class="label" x="40" y="52" font-size="30">One Lead. Bounded specialists. Visible evidence.</text>
  <text class="small" x="40" y="80">A plain-English goal becomes a Sprint, Batches, and Tasks. Only two specialist agents run at once.</text>

  <text class="note" x="40" y="118" font-size="16">Sprint 0</text>
  <g transform="translate(40 128)">
    <rect class="card lead" width="280" height="170" rx="18" />
    <text class="label" x="140" y="36" text-anchor="middle" font-size="26" fill="#fffdf8">LEAD</text>
    <text class="note" x="110" y="70" font-size="18">Classify nature &rarr; tier</text>
    <text class="note" x="110" y="100" font-size="18">Plan Sprint/Batch/Task</text>
    <text class="note" x="110" y="130" font-size="18">Dispatch one owner per task</text>
  </g>

  <path class="arrow" d="M320 190 H355" />
  <path class="arrow" d="M320 255 H355" />
  <g font-family="Arial" font-size="15" fill="#333">
    <text x="325" y="185">Batch A</text>
    <text x="325" y="260">Batch B</text>
  </g>

  <g transform="translate(355 165)">
    <rect class="agent" width="260" height="130" rx="14" />
    <text class="note" x="130" y="30" text-anchor="middle" font-size="20">Backend Engineer</text>
    <text class="note xsmall" x="15" y="58">Owned: files A</text>
    <text class="note xsmall" x="15" y="78">Stop: focused check</text>
    <text class="note xsmall" x="15" y="98">Frozen candidate</text>
  </g>

  <g transform="translate(355 260)">
    <rect class="agent" width="260" height="130" rx="14" />
    <text class="note" x="130" y="30" text-anchor="middle" font-size="20">Frontend Builder</text>
    <text class="note xsmall" x="15" y="58">Owned: files B</text>
    <text class="note xsmall" x="15" y="78">Stop: focused check</text>
    <text class="note xsmall" x="15" y="98">Frozen candidate</text>
  </g>

  <g transform="translate(635 175)">
    <rect class="card gate" width="200" height="100" rx="14" />
    <text class="note" x="100" y="32" text-anchor="middle" font-size="18">WIP &le; 2</text>
    <text class="note xsmall" x="20" y="58">ordinary agents max</text>
    <text class="note xsmall" x="20" y="76">parallel; +1 read-only</text>
    <text class="note xsmall" x="20" y="94">supervisor when admitted</text>
  </g>

  <path class="arrow" d="M615 230 H645" />
  <path class="arrow" d="M615 320 H645 V245" />

  <g transform="translate(875 190)">
    <rect class="card gate" width="220" height="120" rx="14" />
    <text class="note" x="110" y="32" text-anchor="middle" font-size="20">Code Reviewer</text>
    <text class="note xsmall" x="20" y="64">Read-only diff first</text>
    <text class="note xsmall" x="20" y="84">Decide route for evidence</text>
    <text class="note xsmall" x="20" y="104">Never accepts</text>
  </g>

  <path class="gatearrow" d="M1095 250 H1135 V260" />

  <g transform="translate(1135 230)">
    <rect class="card gate" width="220" height="120" rx="14" />
    <text class="note" x="110" y="32" text-anchor="middle" font-size="20">Test Engineer</text>
    <text class="note xsmall" x="20" y="64">Independent evidence</text>
    <text class="note xsmall" x="20" y="84">PASS / FAIL / BLOCKED</text>
    <text class="note xsmall" x="20" y="104">No parallel with Gatekeeper</text>
  </g>

  <g transform="translate(720 420)">
    <rect class="card human" width="320" height="130" rx="18" />
    <text class="note" x="160" y="36" text-anchor="middle" font-size="24">Gatekeeper</text>
    <text class="note xsmall" x="25" y="70">Final accept / revise / block</text>
    <text class="note xsmall" x="25" y="100">After evidence for the same candidate</text>
    <text class="note xsmall" x="25" y="120">Never edits code</text>
  </g>

  <path class="humanarrow" d="M880 485 V515" />
  <g font-family="Arial" font-size="15" fill="#c0392b" font-weight="700">
    <text x="860" y="485">evidence</text>
    <text x="860" y="525">decision</text>
  </g>

  <g transform="translate(720 530)">
    <rect class="card human" width="320" height="100" rx="18" />
    <text class="note" x="160" y="36" text-anchor="middle" font-size="24">You</text>
    <text class="note xsmall" x="25" y="70">Approve or block &mdash; silence is not approval</text>
    <text class="note xsmall" x="25" y="90">Commit / push / release need explicit yes</text>
  </g>

  <g transform="translate(40 600)">
    <rect class="card" width="540" height="130" rx="14" />
    <text class="note" x="10" y="28" font-size="18">Tiers (non-binding hints):</text>
    <text class="note xsmall" x="10" y="60">0 cheap/search/docs &middot; 1 build/validate &middot; 2 premium decide &middot; 3 max-risk</text>
    <text class="note xsmall" x="10" y="84">GPT names in the example map are references only. Record planned &rarr; actual.</text>
    <text class="note xsmall" x="10" y="108">Detector accepts any valid model ID, not only gpt-*; fallback is labeled heuristic.</text>
  </g>

  <g transform="translate(620 600)">
    <rect class="card" width="740" height="130" rx="14" />
    <text class="note" x="10" y="28" font-size="18">Canonical roles (no invented roles):</text>
    <text class="note xsmall" x="10" y="60">Lead &middot; PM &middot; System Architect &middot; Advisor &middot; Contradictor &middot; Domain Advisor &middot; Investigator &middot; Backend &middot; Frontend UX Lead &middot; Frontend Builder &middot; Code Reviewer &middot; Test Engineer &middot; Docs Steward &middot; Gatekeeper</text>
    <text class="note xsmall" x="10" y="84">Debate is serial (Inv &rarr; Adv &rarr; Con &rarr; Lead). Different model family for Contradictor vs Advisor and Gatekeeper vs implementer when the pool allows.</text>
    <text class="note xsmall" x="10" y="108">A supervisor relay may observe one run only; it never replaces review, test evidence, or acceptance.</text>
  </g>

  <text class="note xsmall" x="40" y="740">Lite, public framework. Private project features, Customer-0 evidence, and hosted behavior are excluded; see Project scope.</text>
</svg>
